<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Encontrá con quién jugar, en cualquier deporte.">
  <meta name="theme-color" content="#1E4D40">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DAFStudio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DAFStudio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash de marca mientras carga Flutter — se quita en el primer frame. */
    html, body { margin: 0; height: 100%; background: #14201C; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(160deg, #24473B 0%, #14201C 70%);
      font-family: system-ui, sans-serif;
    }
    #splash .wordmark { color: #EAE6D9; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    #splash .wordmark span { color: #FFC24B; }
    #splash .pulse {
      width: 14px; height: 14px; border-radius: 50%; background: #FFC24B;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.6); opacity: .5; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="wordmark">DAFStudio<span>.</span></div>
    <div class="pulse"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
